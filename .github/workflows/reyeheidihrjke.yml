name: Windows RDP & Web Desktop Node

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: "Windows Edition (win10, tiny10, win11, ltsc10, tiny11)"
        required: true
        default: "win10"
      ram_size:
        description: "RAM Allocation"
        required: true
        default: "5G"
      cpu_cores:
        description: "CPU Cores"
        required: true
        default: "2"
      rdp_username:
        description: "RDP Username"
        required: true
        default: "docker"
      rdp_password:
        description: "RDP Password"
        required: true
        default: "password"
      enable_warp:
        description: "Enable Outbound Cloudflare WARP IP (AS13335)"
        type: boolean
        default: false
        required: false
      discord_webhook:
        description: "Discord Webhook URL (optional, to receive private connection credentials)"
        required: false
        type: string
        default: ""

jobs:
  launch-windows-node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 🛡️ Establish Cloudflare WARP Ghost Tunnel
        if: ${{ inputs.enable_warp == true || inputs.enable_warp == 'true' }}
        uses: fscarmen/warp-on-actions@v1.2
        with:
          stack: ipv4 # Enables IPv4 routing only to prevent IPv6 drops

      - name: Enable KVM Hardware Acceleration & Install Tunnels
        run: |
          echo "[+] Checking KVM hardware acceleration..."
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -la /dev/kvm
            echo "✅ /dev/kvm is ACTIVE and accessible!"
          else
            echo "❌ /dev/kvm not found! Ensure runner supports nested virtualization."
            exit 1
          fi

          echo "[+] Installing cloudflared for Web Desktop (Port 8006)..."
          curl -sL --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb

          echo "[+] Installing bore for Native RDP TCP Tunnel (Port 3389)..."
          curl -sL https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz | sudo tar -xzf - -C /usr/local/bin bore
          chmod +x /usr/local/bin/bore
          echo "✅ bore installed: $(bore --version || echo 'OK')"

      - name: Launch Windows 10 Container & Expose RDP and Web Desktop
        env:
          INPUT_DISCORD: ${{ github.event.inputs.discord_webhook }}
          SECRET_DISCORD: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          DISCORD_WEBHOOK="${INPUT_DISCORD:-$SECRET_DISCORD}"

          # Mask input password immediately
          RDP_PASS="${{ github.event.inputs.rdp_password }}"
          echo "::add-mask::$RDP_PASS"

          echo "=================================================================="
          echo "🚀 1. LAUNCHING DOCKURR/WINDOWS CONTAINER (${{ github.event.inputs.windows_version }})..."
          echo "=================================================================="
          docker run -d \
            --name votify-windows-node \
            --device /dev/kvm \
            --cap-add NET_ADMIN \
            -p 8006:8006 \
            -p 3389:3389 \
            -p 8080:8080 \
            -e VERSION="${{ github.event.inputs.windows_version }}" \
            -e RAM_SIZE="${{ github.event.inputs.ram_size }}" \
            -e CPU_CORES="${{ github.event.inputs.cpu_cores }}" \
            -e DISK_SIZE="24G" \
            -e USERNAME="${{ github.event.inputs.rdp_username }}" \
            -e PASSWORD="$RDP_PASS" \
            dockurr/windows:latest

          echo "=================================================================="
          echo "🌐 2. STARTING SECURE CLOUDFLARE WEB TUNNEL (PORT 8006)..."
          echo "=================================================================="
          cloudflared tunnel --url http://127.0.0.1:8006 > desktop_tunnel.log 2>&1 &

          echo "[+] Waiting for Cloudflare Web Desktop URL to resolve..."
          DESKTOP_URL=""
          for i in {1..35}; do
            DESKTOP_URL=$(grep -o "https://[a-zA-Z0-9-]*\.trycloudflare\.com" desktop_tunnel.log 2>/dev/null | head -n 1 || true)
            if [ -n "$DESKTOP_URL" ]; then
              break
            fi
            sleep 1
          done

          echo "=================================================================="
          echo "⚡ 3. STARTING BORE TCP TUNNEL FOR RDP (PORT 3389)..."
          echo "=================================================================="
          bore local 3389 --to bore.pub > rdp_tunnel.log 2>&1 &

          echo "[+] Waiting for Bore RDP TCP address to resolve..."
          RDP_HOST=""
          for i in {1..35}; do
            RDP_HOST=$(grep -oE "bore\.pub:[0-9]+" rdp_tunnel.log 2>/dev/null | head -n 1 || true)
            if [ -n "$RDP_HOST" ]; then
              break
            fi
            sleep 1
          done

          CURRENT_IP=$(curl -s https://api.ipify.org 2>/dev/null || echo "Unknown")
          WARP_STATE="${{ github.event.inputs.enable_warp }}"

          # ====================================================================
          # SECURITY: If Discord Webhook is provided, hide credentials from logs!
          # ====================================================================
          if [ -n "$DISCORD_WEBHOOK" ]; then
            echo "::add-mask::$DESKTOP_URL"
            echo "::add-mask::$RDP_HOST"
            echo "::add-mask::$CURRENT_IP"

            echo ""
            echo "=================================================================="
            echo "🔒 SECURE MODE ACTIVE (Public Repo Protection)"
            echo "=================================================================="
            echo "   ✅ Windows 10 Node & Tunnels are LIVE!"
            echo "   📨 Full RDP & Web Desktop credentials sent PRIVATELY to Discord!"
            echo "   🛡️ Web Desktop URL and RDP Password are HIDDEN from public logs"
            echo "      to prevent strangers on GitHub from hijacking your machine."
            echo "=================================================================="
            echo "⚡  KVM ACCELERATION : ACTIVE (/dev/kvm)"
            echo "🧠  RAM ALLOCATION   : ${{ github.event.inputs.ram_size }}"
            echo "⚙️  CPU CORES        : ${{ github.event.inputs.cpu_cores }}"
            echo "=================================================================="
            echo ""

            echo "### 🔒 Windows Node Ready (Secure Mode)" >> "$GITHUB_STEP_SUMMARY"
            echo "RDP and Web Desktop credentials have been securely dispatched to your **Discord webhook**." >> "$GITHUB_STEP_SUMMARY"
            echo "> 🛡️ Web URL and Passwords are masked in public logs to keep your runner safe from unauthorized access." >> "$GITHUB_STEP_SUMMARY"

            echo "[+] Sending RDP and Web Desktop credentials directly to Discord..."
            curl -s -H "Content-Type: application/json" -X POST -d "{\"content\": \"🚀 **Windows 10 Remote Desktop & Web Node LIVE**\n\n🖥️ **Native RDP App:**\n• Host: \`$RDP_HOST\`\n• User: \`${{ github.event.inputs.rdp_username }}\`\n• Pass: \`$RDP_PASS\`\n\n🌐 **Web Browser Desktop:**\n$DESKTOP_URL\n\n⚡ **KVM Acceleration:** ENABLED (/dev/kvm)\n🌐 **Outbound IP:** $CURRENT_IP (WARP: ${WARP_STATE:-false})\n🧠 **RAM:** ${{ github.event.inputs.ram_size }}\"}" "$DISCORD_WEBHOOK" || true

          else
            echo ""
            echo "=================================================================="
            echo "⚠️  WARNING: NO DISCORD WEBHOOK PROVIDED (Credentials Visible in Public Logs)"
            echo "=================================================================="
            echo "🖥️  NATIVE RDP APP CONNECTION (Microsoft Remote Desktop / mstsc):"
            echo "      Computer / Host : $RDP_HOST"
            echo "      Username        : ${{ github.event.inputs.rdp_username }}"
            echo "      Password        : $RDP_PASS"
            echo ""
            echo "🌐  WEB BROWSER DESKTOP (Chrome / Edge / Safari / Phone):"
            echo "      Web Link        : $DESKTOP_URL"
            echo ""
            echo "⚡  KVM ACCELERATION : ACTIVE (/dev/kvm)"
            echo "🌐  OUTBOUND IP      : $CURRENT_IP (WARP: ${WARP_STATE:-false})"
            echo "🧠  RAM ALLOCATION   : ${{ github.event.inputs.ram_size }}"
            echo "⚙️  CPU CORES        : ${{ github.event.inputs.cpu_cores }}"
            echo "=================================================================="
            echo "👉 TIP: Provide a discord_webhook input next time to hide"
            echo "   these credentials completely from public GitHub logs!"
            echo "=================================================================="
            echo ""

            echo "### 📱 Enter these exact fields in Remote Desktop:" >> "$GITHUB_STEP_SUMMARY"
            echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Computer / Host** | \`$RDP_HOST\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Username** | \`${{ github.event.inputs.rdp_username }}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Password** | \`$RDP_PASS\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Web Link** | [Open Web Desktop]($DESKTOP_URL) |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "=================================================================="
          echo "📜 STREAMING WINDOWS BOOT LOGS (ACTIVE UP TO 6 HOURS)..."
          echo "=================================================================="
          docker logs -f votify-windows-node &
          
          # Keep runner alive for full 6-hour limit
          sleep 21600
